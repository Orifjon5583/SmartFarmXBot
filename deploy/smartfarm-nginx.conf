# SmartFarm IoT Dashboard — smartfarm.orifdev.uz
# Server IP: 56.228.24.251
#
# DNS records required:
#   smartfarm.orifdev.uz     A  56.228.24.251
#   api.smartfarm.orifdev.uz A  56.228.24.251
#
# Backend listens on 127.0.0.1:5000

# --- Frontend: React SPA ---
server {
    listen 80;
    server_name smartfarm.orifdev.uz;

    root /var/www/smartfarm/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# --- Backend API + WebSocket ---
server {
    listen 80;
    server_name api.smartfarm.orifdev.uz;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support for Socket.IO
    location /socket.io {
        proxy_pass http://127.0.0.1:5000/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
