# Replace example.uz with your sayt.uz domain.
#
# DNS in sayt.uz:
#   app.example.uz  A  YOUR_SERVER_IP
#   api.example.uz  A  YOUR_SERVER_IP
#
# Backend process should listen on 127.0.0.1:5000.

server {
    listen 80;
    server_name app.example.uz;

    root /var/www/issiqxona/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.example.uz;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
